input {
  file {
    path => "/app/logs/consumer-*.log"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec => multiline {
      pattern => "^\d{2}/\d{2}/\d{4}"
      negate => true
      what => "previous"
    }
    mode => "read"
    discover_interval => 10
    stat_interval => "5 second"
  }
}

filter {

}

output {
  elasticsearch {
    hosts    => ["http://es01:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index    => "consumer-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
  stdout { codec => rubydebug }
}
